name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Descargar tipografías (Google Fonts)
        run: |
          mkdir -p app/src/main/assets/fonts
          B=https://raw.githubusercontent.com/google/fonts/main/ofl
          dl() { curl -fsSL "$B/$1" -o "app/src/main/assets/fonts/$2.ttf" || echo "omitida $2"; }
          dl pacifico/Pacifico-Regular.ttf pacifico
          dl lobster/Lobster-Regular.ttf lobster
          dl bebasneue/BebasNeue-Regular.ttf bebasneue
          dl righteous/Righteous-Regular.ttf righteous
          dl abrilfatface/AbrilFatface-Regular.ttf abrilfatface
          dl ../apache/satisfy/Satisfy-Regular.ttf satisfy
          dl ../apache/permanentmarker/PermanentMarker-Regular.ttf permanentmarker
          dl monoton/Monoton-Regular.ttf monoton
          dl "dancingscript/DancingScript%5Bwght%5D.ttf" dancingscript
          dl "playfairdisplay/PlayfairDisplay%5Bwght%5D.ttf" playfair
          dl "caveat/Caveat%5Bwght%5D.ttf" caveat
          dl "orbitron/Orbitron%5Bwght%5D.ttf" orbitron
          dl "cinzel/Cinzel%5Bwght%5D.ttf" cinzel
          dl greatvibes/GreatVibes-Regular.ttf greatvibes
          dl pressstart2p/PressStart2P-Regular.ttf pressstart2p
          dl bangers/Bangers-Regular.ttf bangers
          dl creepster/Creepster-Regular.ttf creepster
          dl audiowide/Audiowide-Regular.ttf audiowide
          dl shadowsintolight/ShadowsIntoLight.ttf shadowsintolight
          dl ../apache/yellowtail/Yellowtail-Regular.ttf yellowtail
          dl ../apache/specialelite/SpecialElite-Regular.ttf specialelite
          dl cookie/Cookie-Regular.ttf cookie
          dl ../apache/chewy/Chewy-Regular.ttf chewy
          dl blackopsone/BlackOpsOne-Regular.ttf blackopsone
      - run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: GroupLauncher
          path: app/build/outputs/apk/release/*.apk
